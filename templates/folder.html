{{ define "folder" }}
{{ template "header" .Meta }}
<main class="grow prose prose-neutral dark:prose-invert hover:prose-a:text-indigo-500">
    <h1>{{ .Meta.Title }}</h1>

    <section class="mt-16">
        {{ range $page := PagesIn .Pages .Name | SortByKey "Title" | SortByKey "Date" }}
            <div class="py-1">
                <a href="{{ $page.Name | Basename }}">{{ $page.Meta.Title }}</a>
            </div>
        {{ end }}
    </section>
</main>
{{ template "footer" .Meta }}
{{ end }}
